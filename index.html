<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Version 7, Milestone 171G: homepage title/description brought in
      line with the owner-approved target Google branded search
      appearance — see js/seo.js and js/router.js's home route entry
      for why the LIVE rendered <title>/description (what a JS-
      executing crawler like Googlebot actually sees) needed a matching
      fix, not just this static tag. Every other route keeps its own
      unique title/description — see setPageMeta()'s `fullTitle` param,
      used only by the home route.
    -->
    <title>Seasonedz Group | Colouring Books &amp; Creative Products</title>
    <meta
      name="description"
      content="Shop educational, Bible and mindfulness colouring books, markers, crayons and creative products for kids, families, schools and churches in South Africa."
    />

    <!--
      Version 7, Milestone 90: favicon/icon set, cropped from the
      existing Seasonedz Group "S" logo mark (public/images/
      logo-placeholder.jpeg) — see scripts used to generate these for
      the exact crop. favicon.svg embeds the same raster artwork in an
      SVG wrapper (no vector source exists for this logo, and
      auto-tracing it risked distorting the brand mark), so browsers
      that support type="image/svg+xml" favicons get the same crisp
      512px art; the .ico fallback covers everything else.
    -->
    <!--
      Version 7, Milestone 149: preloads the homepage hero banner —
      it's the homepage's LCP candidate, and this file is shared by
      every route (this SPA has no per-route <head>), so this is the
      one plain, zero-JS way to hint it early regardless of which
      route a visitor lands on first. At ~300KB this is a deliberately
      small tradeoff for non-homepage first loads.
    -->
    <link
      rel="preload"
      as="image"
      href="/images/home/seasonedz-group-educational-colouring-books-hero.webp"
      fetchpriority="high"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Version 7, Milestone 89: static defaults for the very first paint
      (before any JS runs), for the homepage itself, and as a fallback
      for the brief moment before router.js's first render — js/seo.js
      then sets the real per-route title, description, robots and
      (Version 7, Milestone 99) canonical href on every navigation,
      overriding these. robots here matches seo.js's own default
      ("index, follow"); private/transactional routes get "noindex,
      nofollow" from seo.js at render time, same as before.
    -->
    <link rel="canonical" href="https://www.seasonedzgroup.co.za/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#e07a3f" />

    <meta property="og:site_name" content="Seasonedz Group" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Seasonedz Group | Colouring Books &amp; Creative Products" />
    <meta
      property="og:description"
      content="Shop educational, Bible and mindfulness colouring books, markers, crayons and creative products for kids, families, schools and churches in South Africa."
    />
    <meta property="og:url" content="https://www.seasonedzgroup.co.za/" />
    <!-- Version 7, Milestone 150: updated from the old hero-banner.jpg
         (no longer used anywhere — see pages/home.js) to the current,
         owner-approved homepage hero, so social-share previews match
         what the homepage actually shows. Version 7, Milestone 171G:
         image itself is unchanged (still objectively correct/working) —
         only the title/description text above was brought in line with
         the target Google branded search appearance. -->
    <meta property="og:image" content="https://www.seasonedzgroup.co.za/images/home/seasonedz-group-educational-colouring-books-hero.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seasonedz Group | Colouring Books &amp; Creative Products" />
    <meta
      name="twitter:description"
      content="Shop educational, Bible and mindfulness colouring books, markers, crayons and creative products for kids, families, schools and churches in South Africa."
    />
    <meta name="twitter:image" content="https://www.seasonedzgroup.co.za/images/home/seasonedz-group-educational-colouring-books-hero.webp" />

    <!--
      Version 6, Milestone 48: site-wide Organization structured data.
      Static and safe to ship unconditionally (no per-page data, no
      invented facts) — per-product Product structured data is added
      dynamically by src/pages/productDetails.js via src/js/seo.js.
      Version 7, Milestone 89: logo is now a fully-qualified URL, per
      Google's structured-data guidance (a relative URL isn't
      guaranteed to resolve correctly for every consumer of this data).
      Version 7, Milestone 90: logo now points at icon-512.png (the
      same tight square crop of the brand's "S" mark used for the
      favicon/app icons) instead of the full logo-with-wordmark image —
      Google's guidance for this field asks for a clean square image,
      and the full logo file has a lot of surrounding whitespace around
      a non-square composition.

      Version 7, Milestone 171G: added `url` (was missing) and a stable
      `@id` so this entity can be unambiguously referenced elsewhere in
      this document's structured data (see the WebSite block's own
      @id below) — no restructuring beyond that. `description` brought
      in line with the same target homepage description used in the
      <title>/meta description above, for consistency across every
      surface describing the same page. Deliberately still no `sameAs`,
      `email`, or `telephone` — none were present before this milestone,
      and none are added now; see the milestone's own final report for
      why (a genuine, owner-verified Google Business Profile URL exists
      in src/data/businessInfo.js but is a Maps/Business listing, not a
      social profile, and adding it here wasn't judged to be within this
      section's "verified social profile" intent — left for the owner
      to decide in a future milestone rather than added unilaterally).
      Still zero AggregateRating/Review here or on WebSite — genuine
      per-product reviews (see ProductReview) remain the only source of
      any rating markup anywhere on this site.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.seasonedzgroup.co.za/#organization",
        "name": "Seasonedz Group",
        "url": "https://www.seasonedzgroup.co.za/",
        "description": "Shop educational, Bible and mindfulness colouring books, markers, crayons and creative products for kids, families, schools and churches in South Africa.",
        "logo": "https://www.seasonedzgroup.co.za/icon-512.png"
      }
    </script>

    <!--
      Version 7, Milestone 89: site-wide WebSite structured data, with
      a SearchAction pointing at the real, working /search route (see
      src/pages/searchResults.js) — safe to include since it's a real,
      functioning search, not a fabricated capability; /search itself
      stays noindex (Version 7, Milestone 88A) independently of this,
      since noindex only affects whether the results page is indexed
      as its own page, not whether it can be used as a SearchAction
      target.

      Version 7, Milestone 171G: added a stable `@id` (paired with the
      Organization block's own @id above) and `alternateName: "Seasonedz"`
      — the latter is not invented for SEO: "Seasonedz" is already the
      site's own established public short form, used as the PWA
      manifest's `short_name` (public/site.webmanifest, shown on a
      visitor's home-screen icon) since before this milestone. `name`
      is deliberately kept as the bare brand name, not the fuller
      homepage SEO title — see the milestone's own "SITE NAME VS PAGE
      TITLE" distinction.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.seasonedzgroup.co.za/#website",
        "name": "Seasonedz Group",
        "alternateName": "Seasonedz",
        "url": "https://www.seasonedzgroup.co.za/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.seasonedzgroup.co.za/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/css/base.css" />
    <link rel="stylesheet" href="/src/css/layout.css" />
    <link rel="stylesheet" href="/src/css/components.css" />
    <link rel="stylesheet" href="/src/css/pages.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
